<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#111111"/>

  <!-- Class 1 cluster — blue, lower-left -->
  <circle cx="8"  cy="22" r="3.2" fill="#5baee8"/>
  <circle cx="13" cy="26" r="3.2" fill="#5baee8"/>

  <!-- Class 2 cluster — orange, upper-right -->
  <circle cx="20" cy="7"  r="3.2" fill="#e8814a"/>
  <circle cx="25" cy="11" r="3.2" fill="#e8814a"/>

  <!-- Linear discriminant axis -->
  <line x1="2" y1="30" x2="30" y2="2"
        stroke="#ffffff" stroke-width="1.6"
        stroke-linecap="round" opacity="0.85"/>
</svg>
